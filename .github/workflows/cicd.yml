name: Deploy Flask App to Touge Server
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install dependencies and run tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==8.4.1
          pytest tests/ -v
        continue-on-error: false
      - name: Check secrets
        run: |
          echo "TOUGE_SERVER_IP = [$TOUGE_SERVER_IP]"
          echo "TOUGE_SERVER_IP 长度 = ${#TOUGE_SERVER_IP}  (47.96.157.89 应为 12)"
          echo "TOUGE_SSH_PORT   = [${TOUGE_SSH_PORT:-未配置，将回退 42967}]"
          echo "TOUGE_SSH_PRIVATE_KEY length = ${#TOUGE_SSH_PRIVATE_KEY}  (应为 3389)"
          if [ -z "$TOUGE_SERVER_IP" ]; then
            echo "::error::TOUGE_SERVER_IP 为空，请确认已加在本仓库的 Repository secrets 中"
            exit 1
          fi
          if [ -z "$TOUGE_SSH_PRIVATE_KEY" ]; then
            echo "::error::TOUGE_SSH_PRIVATE_KEY 为空，请确认已加在本仓库的 Repository secrets 中"
            exit 1
          fi
        env:
          TOUGE_SERVER_IP: ${{ secrets.TOUGE_SERVER_IP }}
          TOUGE_SSH_PRIVATE_KEY: ${{ secrets.TOUGE_SSH_PRIVATE_KEY }}
      - name: Deploy to Touge Server via SSH
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$TOUGE_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          PORT=${TOUGE_SSH_PORT:-42967}
          echo "连接 ${TOUGE_SERVER_IP}:${PORT}"
          ssh -v -p "$PORT" \
              -o StrictHostKeyChecking=accept-new \
              -o HostKeyAlgorithms=+ssh-rsa \
              -o PubkeyAcceptedAlgorithms=+ssh-rsa \
              "root@$TOUGE_SERVER_IP" << 'EOF'
            set -e
            echo "成功连接服务器：$(whoami)@$(hostname)"
            cd /root/flask-web-app || { echo "项目目录不存在"; exit 1; }
            git pull origin main || { echo "Git拉取失败"; exit 1; }
            pip3 install -r requirements.txt || { echo "依赖安装失败"; exit 1; }
            supervisorctl restart flask-web-app || { echo "应用重启失败"; exit 1; }
            supervisorctl status flask-web-app
            echo "部署完成"
          EOF
        env:
          TOUGE_SSH_PRIVATE_KEY: ${{ secrets.TOUGE_SSH_PRIVATE_KEY }}
          TOUGE_SERVER_IP: ${{ secrets.TOUGE_SERVER_IP }}
          TOUGE_SSH_PORT: ${{ secrets.TOUGE_SSH_PORT }}
